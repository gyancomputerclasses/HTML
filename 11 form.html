<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form tag</title>
</head>
<body>
    <form action="" method="post">
        <label for="">Name</label>
        <input type="text" placeholder="full name">
        <br>
        <label for="">Date</label>
        <input type="date" >
        
    </form>


    <table>
        <tr>
            <td><label for="">Name</label></td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td><label for="">Father's Name</label></td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td><label for="">Mother's Name</label></td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td><label for="">DOB</label></td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td><label for="">Religion</label></td>
            <td>
                <input type="checkbox"><label for="">Hindu</label>
                <input type="checkbox"><label for="">shikh</label>
                <input type="checkbox"><label for="">Muslim</label>
            </td>

        </tr>
        <tr>
            <td><label for="">Address</label></td>
            <td><textarea name="" id=""></textarea></td>
        </tr>
        <tr>
            <td><label for="">Select Course</label></td>
            <td>
                <select name="" id="">
                    <option value="">ADCA</option>
                    <option value="">Web Design</option>
                </select>
            </td>
        </tr>
    </table>
</body>
</html>
