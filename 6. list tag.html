<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list tag</title>
</head>
<body>
    <!-- list tag used for display all words list format such as order list or unorder list format. -->

    <!-- order list -->
     <!-- change order list format using "type=A, 1, i, a" property -->
    <ol >
        <li>Computer</li>
        <li>Mobile</li>
        <li>Laptop</li>
        <li>tablet</li>
    </ol>

    <ol type="A">
         <li>Computer</li>
        <li>Mobile</li>
        <li>Laptop</li>
        <li>tablet</li>
    </ol>

    <ol type="i">
         <li>Computer</li>
        <li>Mobile</li>
        <li>Laptop</li>
        <li>tablet</li>
    </ol>

    <!-- unorder list -->
     <ul>
        <li>Computer</li>
        <li>Mobile</li>
        <li>Laptop</li>
        <li>tablet</li>
     </ul>

     <!-- change format using css -->
     <ul style="list-style-type:circle;">
         <li>Computer</li>
        <li>Mobile</li>
        <li>Laptop</li>
        <li>tablet</li>
     </ul>
</body>
</html>
