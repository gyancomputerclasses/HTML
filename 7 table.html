<html lang="en">
<head>

    <title>table</title>

<body>
    <!-- table used for display data structure format. which start <table></table> and <th> heading, <td> column, <tr> row. -->
        <table border="1" cellspacing="0" cellpadding="15px" align="center" width="100%">
            <tr>
                <th >sr.no</th>
                <th>Name</th>
                <th>DOB</th>
            </tr>
            <tr align="right">
                <td>1</td>
                <td callspan="2">Sahil</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Ritik</td>
            </tr>
        </table>

            </tr>
            <tr>
                <td></td>

            </tr><tr>
                <td></td>

            </tr><tr>
                <td></td>

            </tr><tr>

</body>
</html>
